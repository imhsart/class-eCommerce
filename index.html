<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>E-Commerce Website</title>
</head>
<body>
  <div class="container">
    <div class="home-screen">
      <!-- navbar starts -->
      <div class="navbar">
        <div class="left">
          <img id="logo" alt="logo" src="./assets/shopoppe-logo.png">
          <ul class="navbar-icons">
            <li><a id="home">Home</a></li>
            <li><a id="favorites">Favorites</a></li>
            <li><a id="orders">Orders</a></li>
            <li><a id="contact">Contact</a></li>
            <li><a id="about">About Us</a></li>
          </ul>
        </div>
        <div class="right">
          <div class="profile">
            Profile
          </div>
          <div class="cart-button">
            <button id="navbar-cart">
              <svg style="height: 24px; width: 24px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
                      <circle cx="10" cy="20" r="1.5" fill="currentColor"/>
                      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
                </svg>
            </button>
              <div id="cart-count-badge"></div>
          </div>
        </div>
      </div>
      <!-- navbar closes -->
      <div class="content">
        <!-- individual card structure
          handled by script
        card closes -->




   

      </div>
      <!-- content closes here -->
    </div>

  </div>
  <!-- modal -->
  <div class="preview-modal">
   <!-- managed through class -->
  </div>
  <!-- modal closes -->
   
  <script type="module" src="script.js"></script>
</body>
</html>
